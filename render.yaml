services:
  - type: web
    name: creator-bd-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_VERIFICATION_TOKEN
        sync: false
      - key: FEISHU_ENCRYPT_KEY
        sync: false
      - key: FEISHU_BASE_APP_TOKEN
        sync: false
      - key: FEISHU_BASE_TABLE_ID
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: creator-bd-agent-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: MAILBOX_ENCRYPTION_KEY
        generateValue: true
      - key: MAILBOX_INITIAL_SYNC_LIMIT
        value: "20"
      - key: MAILBOX_SYNC_INTERVAL_MINUTES
        value: "2"

databases:
  - name: creator-bd-agent-db
    plan: free
    databaseName: creator_bd_agent
    user: creator_bd_agent
    ipAllowList: []
